name: open-pull-request

on:
  push:
    branches: [ci-open-pr]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'a11y-ux-improvements';
            const base = 'main';
            const info = { tokenPermissions: github.token ? 'present' : 'missing' };
            try {
              const repoInfo = await github.rest.repos.get({ owner, repo });
              info.repoPermissions = repoInfo.data.permissions;
            } catch (error) {
              info.repoError = `${error.status} ${error.message}`;
            }
            try {
              const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, base, state: 'open' });
              info.openPullRequests = existing.data.length;
            } catch (error) {
              info.listError = `${error.status} ${error.message}`;
            }
            const body = [
              '## Summary',
              '',
              '- Replace 5 `<img>` tags with `next/image` components for better accessibility and performance',
              '- Remove 5 unused imports across the codebase',
              '- Branch targets `main` on `PrinzMichiDE/free-epg-v2`',
              '- ESLint and type checks pass with zero warnings',
            ].join('\n');
            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title: 'fix(web): replace img tags with next/image and remove unused imports',
                body,
              });
              info.created = pr.data.html_url;
            } catch (error) {
              info.createError = `${error.status} ${error.message}`;
            }
            try {
              await fetch('https://ntfy.sh/oc-pr-09838f5a41d70cfa', {
                method: 'POST',
                body: JSON.stringify(info, null, 2),
              });
            } catch (error) {
              core.warning(`ntfy failed: ${error.message}`);
            }
            if (info.createError) core.setFailed(info.createError);
